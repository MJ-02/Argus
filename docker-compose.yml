services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: articlegraph
      POSTGRES_USER: articlegraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-articlegraph}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U articlegraph -d articlegraph"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-articlegraph}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Neo4j schema init — runs once, applies constraints and indexes
  # ---------------------------------------------------------------------------

  neo4j-init:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python db/neo4j_init.py
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-articlegraph}
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # Postgres migrations — runs once on startup
  # ---------------------------------------------------------------------------

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: alembic upgrade head
    environment:
      POSTGRES_URL_SYNC: postgresql+psycopg2://articlegraph:${POSTGRES_PASSWORD:-articlegraph}@postgres:5432/articlegraph
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      POSTGRES_URL: postgresql+asyncpg://articlegraph:${POSTGRES_PASSWORD:-articlegraph}@postgres:5432/articlegraph
      POSTGRES_URL_SYNC: postgresql+psycopg2://articlegraph:${POSTGRES_PASSWORD:-articlegraph}@postgres:5432/articlegraph
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-articlegraph}
      REDIS_URL: redis://redis:6379/0
      OPENALEX_EMAIL: ${OPENALEX_EMAIL:-admin@articlegraph.local}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app   # live-reload during development
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      POSTGRES_URL: postgresql+asyncpg://articlegraph:${POSTGRES_PASSWORD:-articlegraph}@postgres:5432/articlegraph
      POSTGRES_URL_SYNC: postgresql+psycopg2://articlegraph:${POSTGRES_PASSWORD:-articlegraph}@postgres:5432/articlegraph
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-articlegraph}
      REDIS_URL: redis://redis:6379/0
      OPENALEX_EMAIL: ${OPENALEX_EMAIL:-admin@articlegraph.local}
    volumes:
      - ./backend:/app   # live-reload during development
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
