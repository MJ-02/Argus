[project]
name = "argus"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
  # Shared / config
  "pydantic-settings>=2.0",
  "python-json-logger>=2.0",
  # Database
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "psycopg2-binary>=2.9",
  "neo4j>=5.0",
  # API
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  # Workers
  "celery[redis]>=5.3",
  "redis>=5.0",
  # Crawler
  "httpx>=0.27",
  "prometheus-fastapi-instrumentator>=7.0",
  "prometheus-client>=0.20",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "testcontainers[neo4j,postgres]>=4.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "crawler", "db", "shared", "workers"]
